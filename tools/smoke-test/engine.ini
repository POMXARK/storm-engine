; Run via run.sh. run_in_background: frames are not processed while the window is inactive
; Minimal Storm Engine smoke test: window + renderer (dxvk) + sound service, exits by itself
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = smoke.c
title = Storm smoke test

[script]
debuginfo = 1
tracefiles = 1

[sound]
fade_time = 0.5
