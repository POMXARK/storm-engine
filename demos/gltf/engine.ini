; glTF demo: models converted from glTF (Kenney Pirate Kit) by tools/gltf2gm, placed by a scene. Run via run.sh
full_screen = 0
screen_x = 1280
screen_y = 800
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = gltf.c
; without it the engine uses the empty CONTROLS stub and the camera gets no input
controls = pcs_controls
title = Storm glTF demo

[script]
debuginfo = 1
tracefiles = 1
