; Scene demo: a scene made in the editor (resource/scenes/*.scene), loaded by LoadScene. Run via run.sh
full_screen = 0
screen_x = 1280
screen_y = 800
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = scene.c
; without it the engine uses the empty CONTROLS stub and the camera gets no input
controls = pcs_controls
title = Storm scene demo

[script]
debuginfo = 1
tracefiles = 1
