; Model demo: .gm models, free camera, sun lighting. Run via run.sh
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = model.c
; without it the engine uses the empty CONTROLS stub and the camera gets no input
controls = pcs_controls
title = Storm model demo

[script]
debuginfo = 1
tracefiles = 1
