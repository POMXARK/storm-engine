; Battle demo: broadsides, cannonballs (AIBalls), hits on the hull, sails and masts, a sinking ship. Run via run.sh
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = battle.c
; without it the engine uses the empty CONTROLS stub and the ship and the camera get no input
controls = pcs_controls
title = Storm battle demo

[script]
debuginfo = 1
tracefiles = 1

[Sea]
; foam on the wave crests
FoamEnable = 1
