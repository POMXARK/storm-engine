; Menu control autotest: the main menu driven from the script side. Run via run.sh
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = menu_autotest.c
; the interface reads the controls state, without it the engine uses the empty CONTROLS stub
controls = pcs_controls
title = Storm menu control autotest
startFontIniFile = resource\ini\fonts.ini
font = interface_normal

[script]
debuginfo = 1
tracefiles = 1
