; Melee demo: a sword fight in the location yard (blades, fight actions, NPC fight AI). Run via run.sh
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = melee.c
; without it the engine uses the empty CONTROLS stub and the player and the camera get no input
controls = pcs_controls
title = Storm melee demo

[script]
debuginfo = 1
tracefiles = 1
