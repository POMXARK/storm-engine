; Trigger demo: a zone of the scene and the script reacting to it. Run via run.sh
full_screen = 0
screen_x = 1280
screen_y = 800
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = trigger.c
; without it the engine uses the empty CONTROLS stub and the player and the camera get no input
controls = pcs_controls
title = Storm trigger demo

[script]
debuginfo = 1
tracefiles = 1
