; Dialog demo: a conversation with a sailor on a pier (dialog entity). Run via run.sh
full_screen = 0
screen_x = 800
screen_y = 600
max_fps = 60
run_in_background = 1
Steam = 0
program_directory = program
run = dialog.c
; without it the engine uses the empty CONTROLS stub and the camera gets no input
controls = pcs_controls
title = Storm dialog demo

[script]
debuginfo = 1
tracefiles = 1

[Sea]
; foam on the wave crests
FoamEnable = 1
